<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-title t-desc" id="d-02-two-instances-under-load-root">
        <title id="t-title">Una segunda instancia bajo carga</title>
        <desc id="t-desc">Con 48 usuarios durante 900 segundos sobre una instancia, la mediana de latencia se queda cerca de 14 segundos. La segunda instancia atiende desde cerca del segundo 600 y la mediana baja a unos 7 segundos mientras las peticiones por intervalo se duplican de unas 104 a unas 200.</desc>

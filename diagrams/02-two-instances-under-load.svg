        <text x="40" y="394" fill="#3B5B8C" font-size="14" font-weight="400" font-family="'Instrument Serif', serif" font-style="italic">Con dos instancias las peticiones por ventana se duplicaron (de unas 104 a unas 200) y la espera mediana bajó a la mitad, pero unos 9 minutos después de pedirla.</text>

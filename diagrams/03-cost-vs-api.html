<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Costo por millón de tokens de salida</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #F7F6F2; color: #0F2547;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2.5rem 2rem; }
    .frame { max-width: 1120px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: #3B5B8C; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1040px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Bar chart · vLLM Field Guide</p>
    <h1>Una GPU ocupada sale más barata que la API, y una GPU casi vacía sale mucho más cara</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1040 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-title t-desc">
        <title id="t-title">Costo por millón de tokens de salida</title>
        <desc id="t-desc">Costo por millón de tokens de salida. La L4 con un usuario cuesta USD 15.58, con ocho usuarios USD 2.00. La API gemini-3.8-flash cuesta USD 5.25 con tokens de entrada incluidos hasta fin de 2026 y USD 10.50 desde 2027. El punto de equilibrio son 6,495,543 tokens por día.</desc>
        <rect width="1040" height="560" fill="#F7F6F2"/>
        <text x="40" y="56" fill="#0F2547" font-size="13" font-weight="600" font-family="'Geist', sans-serif">USD por millón de tokens de salida</text>
        <text x="40" y="72" fill="#3B5B8C" font-size="9" font-weight="400" font-family="'Geist Mono', monospace">la API incluye 2 tokens de entrada por cada token de salida; la GPU ya los trae en el precio por hora</text>
        <text x="40" y="119" fill="#0F2547" font-size="11" font-weight="500" font-family="'Geist', sans-serif">L4, 1 usuario</text>
        <rect x="220" y="100" width="584.1" height="28" rx="3" fill="rgba(15,37,71,0.10)" stroke="#3B5B8C" stroke-width="1"/>
        <text x="814.1" y="119" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist Mono', monospace">$15.58</text>
        <text x="40" y="161" fill="#9A6F0B" font-size="11" font-weight="600" font-family="'Geist', sans-serif">L4, 8 usuarios</text>
        <rect x="220" y="142" width="75.15" height="28" rx="3" fill="rgba(197,146,22,0.18)" stroke="#C59216" stroke-width="1"/>
        <text x="305.15" y="161" fill="#9A6F0B" font-size="12" font-weight="600" font-family="'Geist Mono', monospace">$2.00</text>
        <text x="40" y="203" fill="#0F2547" font-size="11" font-weight="500" font-family="'Geist', sans-serif">API hasta 2026</text>
        <rect x="220" y="184" width="196.875" height="28" rx="3" fill="rgba(15,37,71,0.04)" stroke="rgba(15,37,71,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="426.875" y="203" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist Mono', monospace">$5.25</text>
        <text x="40" y="245" fill="#0F2547" font-size="11" font-weight="500" font-family="'Geist', sans-serif">API desde 2027</text>
        <rect x="220" y="226" width="393.75" height="28" rx="3" fill="rgba(15,37,71,0.04)" stroke="rgba(15,37,71,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="623.75" y="245" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist Mono', monospace">$10.50</text>
        <line x1="40" y1="282" x2="1000" y2="282" stroke="rgba(15,37,71,0.10)" stroke-width="0.8"/>
        <text x="40" y="310" fill="#0F2547" font-size="11" font-weight="600" font-family="'Geist', sans-serif">La cuenta que decide</text>
        <rect x="40" y="322" width="300" height="62" rx="3" fill="rgba(15,37,71,0.10)" stroke="#3B5B8C" stroke-width="1"/>
        <text x="52" y="340" fill="#3B5B8C" font-size="9" font-weight="400" font-family="'Geist Mono', monospace">Punto de equilibrio</text>
        <text x="52" y="360" fill="#0F2547" font-size="13" font-weight="600" font-family="'Geist', sans-serif">6,495,543 tokens por día</text>
        <text x="52" y="375" fill="#3B5B8C" font-size="9" font-weight="400" font-family="'Geist', sans-serif">38% de lo que produce una L4 llena</text>
        <rect x="360" y="322" width="300" height="62" rx="3" fill="rgba(15,37,71,0.10)" stroke="#3B5B8C" stroke-width="1"/>
        <text x="372" y="340" fill="#3B5B8C" font-size="9" font-weight="400" font-family="'Geist Mono', monospace">min-instances 1</text>
        <text x="372" y="360" fill="#0F2547" font-size="13" font-weight="600" font-family="'Geist', sans-serif">USD 1,037 al mes</text>
        <text x="372" y="375" fill="#3B5B8C" font-size="9" font-weight="400" font-family="'Geist', sans-serif">la L4 se cobra las 24 horas</text>
        <rect x="680" y="322" width="300" height="62" rx="3" fill="rgba(15,37,71,0.10)" stroke="#3B5B8C" stroke-width="1"/>
        <text x="692" y="340" fill="#3B5B8C" font-size="9" font-weight="400" font-family="'Geist Mono', monospace">min-instances 0</text>
        <text x="692" y="360" fill="#0F2547" font-size="13" font-weight="600" font-family="'Geist', sans-serif">USD 0.47 por despertar</text>
        <text x="692" y="375" fill="#3B5B8C" font-size="9" font-weight="400" font-family="'Geist', sans-serif">cold start más 10.2 min sin tráfico, medido</text>
        <text x="40" y="484" fill="#3B5B8C" font-size="14" font-weight="400" font-family="'Instrument Serif', serif" font-style="italic">Con 8 usuarios a la vez, la misma hora de GPU produce 197 tokens por segundo contra 25 con uno solo.</text>
        <line x1="40" y1="504" x2="1000" y2="504" stroke="rgba(15,37,71,0.10)" stroke-width="0.8"/>
        <text x="40" y="522" fill="#3B5B8C" font-size="8" font-weight="400" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>
        <text x="120" y="522" fill="#0F2547" font-size="9" font-weight="400" font-family="'Geist', sans-serif">Cloud Run con 1 L4, 8 vCPU y 32 GiB a USD 1.42 por hora; gemini-3.8-flash precio de lista revisado el 2026-11-10; tarifas por confirmar en la factura</text>
      </svg>
    </div>
  </div>
</body>
</html>

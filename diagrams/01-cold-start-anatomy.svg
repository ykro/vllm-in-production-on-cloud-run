<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-title t-desc" id="d-01-cold-start-anatomy-root">
        <title id="t-title">Anatomía de un cold start</title>
        <desc id="t-desc">Un cold start de vLLM 0.33.0 con Gemma 4 E4B y los pesos en un bucket de Cloud Storage dura 580 segundos. Los pesos a la GPU toman 263 segundos, torch.compile 54, preparar el modelo 57, el arranque del proceso 86 y el contenedor 66. Los CUDA graphs toman 22 segundos.</desc>

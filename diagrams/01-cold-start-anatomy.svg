        <text x="40" y="464" fill="#3B5B8C" font-size="14" font-weight="400" font-family="'Instrument Serif', serif" font-style="italic">Los pesos a la GPU son 263 s de 580. Desde Hugging Face, sin token, la descarga tardó 262 s en otra región y en us-east4 no terminó en 15 minutos.</text>
        <line x1="40" y1="484" x2="1000" y2="484" stroke="#0f2547" stroke-opacity="0.10" stroke-width="0.8"/>
